# ================================= #
# Universal Hyprlock (Theme-Agnostic)
# ================================= #

# --- GENERAL ---
general {
    hide_cursor = true
    grace = 1
}

# --- BACKGROUND ---
background {
    monitor =
    path = screenshot

    blur_passes = 5
    blur_size = 10
    noise = 0.02
    contrast = 0.9
    brightness = 0.85
}

# --- CLOCK ---
label {
    monitor =
    text = $TIME

    color = rgba(255, 255, 255, 0.92)
    font_size = 96
    font_family = JetBrainsMono NF Bold

    position = 0, 20
    halign = center
    valign = center
}

# --- DATE ---
label {
    monitor =
    text = cmd[update:3600000] echo "$(date +"%A, %d %B")"

    color = rgba(220, 220, 220, 0.6)
    font_size = 22
    font_family = JetBrainsMono NF

    position = 0, -80
    halign = center
    valign = center
}

# --- INPUT FIELD ---
input-field {
    monitor =
    size = 320, 55

    position = 0, 140
    halign = center
    valign = bottom

    outline_thickness = 2
    rounding = 28

    # Neutral glass (works with ALL themes)
    inner_color = rgba(15, 18, 25, 0.75)
    outer_color = rgba(255, 255, 255, 0.15)

    font_color = rgba(255, 255, 255, 0.9)
    font_family = JetBrainsMono NF

    # Feedback states
    check_color = rgba(120, 200, 255, 0.6)
    fail_color  = rgba(255, 90, 90, 0.9)
    fail_timeout = 2000

    placeholder_text = <i>Password</i>

    hide_input = false
    fade_on_empty = true
}
